name: Deploy love story
on:
  push:
    branches: [main, arena/61a8aab7-love]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages deployment mode
        id: pages-mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            echo "Pages is deployed by GitHub from its configured source branch; skipping a duplicate deployment."
          fi
      - name: Prepare public website only
        if: steps.pages-mode.outputs.mode == 'workflow'
        run: |
          mkdir -p _site/assets
          cp index.html style.css app.js memories.js _site/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.pages-mode.outputs.mode == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-mode.outputs.mode == 'workflow'
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.pages-mode.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
